<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sout4js Web Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 32px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }
        h1 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 24px;
        }
        p {
            color: #94a3b8;
            line-height: 1.5;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-trace { background: #64748b; color: white; }
        .btn-debug { background: #0284c7; color: white; }
        .btn-info { background: #16a34a; color: white; }
        .btn-warn { background: #d97706; color: white; }
        .btn-error { background: #dc2626; color: white; }
        .btn-fatal { background: #7f1d1d; color: white; }
        .hint {
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>sout4js Browser Demo</h1>
        <p>Open Developer Tools (F12 or Ctrl+Shift+I) and inspect the <b>Console</b> tab to see styled badges in action.</p>
        
        <div class="buttons">
            <button class="btn-trace" onclick="sout4js.trace('Detailed trace event', { step: 1 })">Trace</button>
            <button class="btn-debug" onclick="sout4js.debug('Debugging query performance', { duration: '12ms' })">Debug</button>
            <button class="btn-info" onclick="sout4js.info('User session initialized', { user: 'guest' })">Info</button>
            <button class="btn-warn" onclick="sout4js.warn('Network response took longer than 500ms')">Warn</button>
            <button class="btn-error" onclick="sout4js.error('Failed to load asset', new Error('HTTP 404'))">Error</button>
            <button class="btn-fatal" onclick="sout4js.fatal('Unrecoverable app state!')">Fatal</button>
        </div>

        <div class="hint">
            Tip: You can also use <code>sout4js.infoAdv("Message", "thread-1", "AppModule")</code>
        </div>
    </div>

    <script src="web/web.js"></script>
    <script>
        sout4js.info("sout4js web demo initialized successfully!");
        sout4js.infoAdv("Welcome to sout4js", "UI", "MainApp", false);
    </script>
</body>
</html>
